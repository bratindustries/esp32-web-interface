; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = esp32_wemos
src_dir = .
data_dir = data
extra_configs = platformio-local-override.ini
boards_dir = boards

[common]
monitor_speed = 115200

[env]
platform = espressif32@~6.13.0
framework = arduino
extra_scripts =
	pre:version.py
	pre:gzip_assets.py
platform_packages = platformio/tool-esptoolpy
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = qout
build_src_filter = +<*> -<.git/> -<.svn/> -<src/flashloader>
upload_speed = 921600

[env:esp32_wemos]
build_flags =
	${env.build_flags}
	-D RELEASE
build_type = release
lib_deps =
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

[env:esp32_wemos_debug]
build_flags = 
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
build_type = debug
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

; --- ESP32-S3 targets ---

; Release build for LILYGO T-2Can (ESP32-S3) — SD_MMC disabled (S3 crash bug)
[env:esp32_t2can]
board = esp32s3_t2can
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.filesystem = spiffs
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D RELEASE
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DBG_OUTPUT_PORT=Serial
	-D S3_SKIP_SD_MMC
build_type = release
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

[env:esp32_t2can_debug]
board = esp32s3_t2can
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.filesystem = spiffs
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D DEBUG
	-D DEBUG_ESP_PORT=Serial
	-D DEBUG_ESP_CORE
	-D DEBUG_ESP_WIFI
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D S3_SKIP_SD_MMC
build_type = debug
lib_deps = 
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	SPI

; Original LILYGO T-Embed (ESP32-S3, 170x320 ST7789).
; CAN defaults TX GPIO17 / RX GPIO16, as in ZombieVerterDisplay.
[env:esp32_tembed]
; LilyGO's own T-Embed examples use the T-Display-S3 board definition.
; Besides the same 16 MB QIO flash and OPI PSRAM layout, it supplies the
; required native USB CDC/JTAG mode and the LilyGO S3 pin variant.
board = lilygo-t-display-s3
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.filesystem = spiffs
build_type = release
build_flags =
	${env.build_flags}
	-D RELEASE
	-D T_EMBED_DISPLAY
	-D CAN_RX_PIN=GPIO_NUM_16
	-D CAN_TX_PIN=GPIO_NUM_17
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DBG_OUTPUT_PORT=Serial
	-D S3_SKIP_SD_MMC
	-D USER_SETUP_LOADED
	-D USE_FSPI_PORT
	-D ST7789_DRIVER
	-D TFT_WIDTH=170
	-D TFT_HEIGHT=320
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_INVERSION_ON
	-D TFT_MISO=-1
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=13
	-D TFT_RST=9
	-D TFT_BL=15
	-D TFT_BACKLIGHT_ON=1
	-D SPI_FREQUENCY=40000000
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
lib_deps =
	${env:esp32_t2can.lib_deps}
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^6.21.5
