	-D S3_SKIP_SD_MMC
	-D CAN_ONLY
	-D CAN_RX_PIN=6
	-D CAN_TX_PIN=7
	-D T_EMBED_DISPLAY
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=170
	-D TFT_HEIGHT=320
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_INVERSION_ON=1
	-D TFT_BL=15
	-D TFT_MISO=-1
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=13
	-D TFT_RST=9
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
build_type = debug
